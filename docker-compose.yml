# Pterodactyl Panel + Wings for a Linux host. Run ./install.sh the first time;
# it creates .env and the Wings config, then starts everything.
#
# Wings uses the same paths inside its container as on the host because it
# asks the host's Docker to bind-mount server files into game containers.

name: pterodactyl

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      - "80:80"
    environment:
      APP_URL: http://${PANEL_ADDRESS}
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      APP_TIMEZONE: ${TZ:-UTC}
      APP_SERVICE_AUTHOR: noreply@example.com
      TRUSTED_PROXIES: "*"
      DB_HOST: database
      DB_PORT: "3306"
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      MAIL_DRIVER: log
      MAIL_FROM: noreply@example.com
    volumes:
      - panel-var:/app/var          # holds .env incl. APP_KEY - don't lose this
      - panel-nginx:/etc/nginx/http.d
      - panel-certs:/etc/letsencrypt
      - panel-logs:/app/storage/logs

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: unless-stopped
    tty: true
    ports:
      - "8080:8080"   # Wings API / websocket
      - "2022:2022"   # SFTP
    environment:
      TZ: ${TZ:-UTC}
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pterodactyl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /etc/pterodactyl:/etc/pterodactyl
      - /var/lib/pterodactyl:/var/lib/pterodactyl
      - /var/log/pterodactyl:/var/log/pterodactyl
      - /tmp/pterodactyl:/tmp/pterodactyl
      - /run/wings:/run/wings        # per-server machine-id files
      - /etc/ssl/certs:/etc/ssl/certs:ro

  # Optional: playit.gg tunnel so people outside the house can join even when
  # the internet provider blocks port forwarding (CGNAT). Set up with
  # ./setup-playit.sh, which adds the key and COMPOSE_PROFILES=playit to .env.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    network_mode: host
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:-}
    profiles: ["playit"]

volumes:
  db:
  panel-var:
  panel-nginx:
  panel-certs:
  panel-logs:
